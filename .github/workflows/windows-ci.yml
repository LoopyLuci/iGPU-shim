name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (stub)
        run: cmake -B build_stub -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSYNAPSE_BUILD_STUB=ON .

      - name: Build
        run: cmake --build build_stub --config Release

      - name: Run CTest
        run: cd build_stub && ctest --output-on-failure -C Release
