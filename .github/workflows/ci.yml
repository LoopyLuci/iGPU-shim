name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Windows – MSVC 19.x ─────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1   # T0-7 fix: replaces nonexistent windows-setup-msvc@v1
        with:
          arch: x64

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.1.1
        with:
          version: latest
          cache: true

      - name: Configure (CMake + MSVC)
        run: cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DSYNAPSE_STUB_DMA=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C Release

  # ── Ubuntu 24.04 – Clang 17+ ───────────────────────────────────────────────
  build-ubuntu:
    runs-on: ubuntu-latest
    env:
      CC:  clang-17
      CXX: clang++-17
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-17 cmake ninja-build \
            libvulkan-dev vulkan-validationlayers-dev \
            python3 git

      - name: Configure (CMake + Clang 17)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DSYNAPSE_STUB_DMA=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (standard)
        working-directory: build
        run: ctest --output-on-failure

      # T3-4: SYNAPSE_POWER_VERIFY build validates power-budget assertions
      - name: Configure (SYNAPSE_POWER_VERIFY)
        run: |
          cmake -B build_pv -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DSYNAPSE_POWER_VERIFY=ON \
            -DSYNAPSE_STUB_DMA=ON

      - name: Build (SYNAPSE_POWER_VERIFY)
        run: cmake --build build_pv --parallel

      - name: Test (SYNAPSE_POWER_VERIFY)
        working-directory: build_pv
        run: ctest --output-on-failure -R ".*_power_verify"

