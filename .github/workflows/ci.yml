name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: windows-setup-msvc@v1 # lightweight helper (community)
        with:
          vs-version: 'latest'
      - name: Build simulate_panning (MSVC)
        shell: powershell
        run: |
          Push-Location synapse\tools
          msbuild simulate_panning.vcxproj /m /p:Configuration=Release
          Pop-Location

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ cmake python3 git
      - name: Build simulate_panning (g++)
        run: |
          g++ -std=c++20 -O2 -I. synapse/tools/simulate_panning.cpp -o synapse/tools/simulate_panning
