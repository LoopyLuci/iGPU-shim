[workspace]
members = [
  "crates/igpu_ml_core",
  "crates/igpu_ml_models",
  "crates/igpu_ml_optim",
  "crates/igpu_ml_python",
  "crates/igpu_ml_ffi",
  "crates/igpu_ml_dashboard",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LoopyLuci/iGPU-shim"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
byteorder = "1"
blake3 = "1"
bincode = "1"
ndarray = { version = "0.15", features = ["serde"] }
rayon = "1.8"
bytemuck = "1.14"
half = "2.4"
num-traits = "0.2"
approx = "0.5"
parking_lot = "0.12"
rand = "0.8"
pyo3 = { version = "0.21", features = ["extension-module"] }
cbindgen = "0.27"
numpy = "0.19"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
